name: Validate Selfie Studio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/scene-lighting-coherence-20261020]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Scene coherence regression tests
        run: npx tsx --test tests/*.test.ts
      - name: Production build
        run: npm run build
